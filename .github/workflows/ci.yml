name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Production build (esbuild)
        run: pnpm run build

      - name: Verify build artifact
        run: |
          test -f main.js || (echo "main.js was not generated" && exit 1)
          ls -lh main.js manifest.json styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-learner-plugin-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
            versions.json
          retention-days: 14
          if-no-files-found: error
